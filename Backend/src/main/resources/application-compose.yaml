spring:
  # Postgres
  jpa:
    hibernate:
      ddl-auto: create
  datasource:
    username: user_app
    password: user_app
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://postgres:5432/postgresfood

  liquibase:
    change-log: classpath:db/changelog/changelog.yaml
    enabled: true

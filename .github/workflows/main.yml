name: Fullstack Deploy

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H s2.small.pl >> ~/.ssh/known_hosts

      - name: Upload server scripts (cert hook, start, deploy, watchdog)
        run: |
          ssh mutarexx@s2.small.pl "mkdir -p /home/mutarexx/backend/scripts /home/mutarexx/backend/certs /home/mutarexx/logs"
          scp Backend/Cert/scripts/convert_and_restart.sh \
              Backend/Deploy/start.sh Backend/Deploy/deploy.sh Backend/Deploy/watchdog.sh \
              mutarexx@s2.small.pl:/home/mutarexx/backend/scripts/
          ssh mutarexx@s2.small.pl "chmod +x /home/mutarexx/backend/scripts/*.sh"

      # === BACKEND ===
      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build Spring Boot backend
        run: |
          cd Backend
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      # Nowy jar czeka obok działającego - podmienia go dopiero deploy.sh
      - name: Upload backend jar to server
        run: |
          scp Backend/target/*.jar mutarexx@s2.small.pl:/home/mutarexx/backend/app.new.jar

      # Sekrety lądują w plikach na serwerze (chmod 600): app.env czyta start.sh (także przy
      # restarcie z watchdoga, gdy sesji z GitHuba już nie ma), keystore.env - hook odnowy certu
      - name: Write secrets to server
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          COINMARKETCAP_API_KEY: ${{ secrets.COINMARKETCAP_API_KEY }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SSL_KEYSTORE_PASSWORD: ${{ secrets.SSL_KEYSTORE_PASSWORD }}
        run: |
          {
            printf 'export GOOGLE_CLIENT_ID=%q\n'      "$GOOGLE_CLIENT_ID"
            printf 'export GOOGLE_CLIENT_SECRET=%q\n'  "$GOOGLE_CLIENT_SECRET"
            printf 'export MAIL_USERNAME=%q\n'         "$MAIL_USERNAME"
            printf 'export MAIL_PASSWORD=%q\n'         "$MAIL_PASSWORD"
            printf 'export JWT_SECRET=%q\n'            "$JWT_SECRET"
            printf 'export COINMARKETCAP_API_KEY=%q\n' "$COINMARKETCAP_API_KEY"
            printf 'export DB_USERNAME=%q\n'           "$DB_USERNAME"
            printf 'export DB_PASSWORD=%q\n'           "$DB_PASSWORD"
            printf 'export SSL_KEYSTORE_PASSWORD=%q\n' "$SSL_KEYSTORE_PASSWORD"
          } | ssh mutarexx@s2.small.pl "umask 077; cat > /home/mutarexx/backend/app.env"

          printf 'export SSL_KEYSTORE_PASSWORD=%q\n' "$SSL_KEYSTORE_PASSWORD" \
            | ssh mutarexx@s2.small.pl "umask 077; cat > /home/mutarexx/backend/certs/keystore.env"

      # Podmiana wersji + health check; gdy nowa wersja nie wstanie, deploy.sh wraca do
      # poprzedniej i kończy się błędem - job się zatrzymuje, frontend nie jest wdrażany
      - name: Deploy backend (health check + rollback)
        run: |
          ssh mutarexx@s2.small.pl /home/mutarexx/backend/scripts/deploy.sh


      # === FRONTEND ===
      - name: Build React frontend
        run: |
          cd frontend5
          npm install --force
          npm run build

      - name: Upload frontend files to server
        run: |
          shopt -s dotglob
          scp -r frontend5/dist/* mutarexx@s2.small.pl:/home/mutarexx/domains/grindtrack.pl/public_html/

version: '3.9'
services:

  backend:
    build: ./Backend
    environment:
      SPRING_PROFILES_ACTIVE: compose
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - webnet

  frontend:
    build: ./frontend5
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - webnet

  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgresfood
      PGUSER: postgres
      PGDATA: /data/postgres
    ports:
      - "5432:5432"
    networks:
      - webnet
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 2s
      retries: 10
    volumes:
      - ./StartupScripts/postgres/:/docker-entrypoint-initdb.d/:ro

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin4_container
    restart: always
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: postgres@zzz.pl
      PGADMIN_DEFAULT_PASSWORD: postgres
    depends_on:
      - postgres
    networks:
      - webnet

networks:
  webnet:
    name: webnet
    driver: bridge
